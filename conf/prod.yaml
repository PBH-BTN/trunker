cache:
  enable: true
  network: tcp # tcp or unix
  addr: localhost:6379


tracker:
  ttl: 3600
  intervalTask: 600 # 10分钟执行一次定时任务
  mode: memory # memory or db
  memory:
    enablePersist: true
    persistFile: persist.dat
    maxPeersPerTorrent: 1500
    shard: 40
    enableWS: true
  rpc:
    enableServer: true
    hostPorts: 0.0.0.0:6789
    remoteServer: localhost:6789
  database:
    database: root
    host: localhost
    port: 3306
    user: root
    pass: root
  xdp:
    # XDP IP filtering (Linux only, requires root or CAP_NET_ADMIN)
    # On macOS/Windows, this will be automatically ignored with application-level fallback
    enable: false  # Set to true to enable XDP filtering
    interface: ""  # Network interface name (e.g., "eth0", "ens33"). Run "ip link show" to find yours
  useUnixSocket: false
  hostPorts: 0.0.0.0:8888
  useAnnounceIP: true
  enableEventProducer: false
  enableMetrics: true
  metricsHostPorts: 0.0.0.0:9091
  udpServer:
    enable: true
    hostPorts: 127.0.0.1:6881
  wsServer:
    enable: true
    shard: 10
  trackerId: default
  debugPort: 6060
rocketmq:
  topic: TrunkerEvent
  endpoint: 127.0.0.1:8081