cache:
  host: localhost
  port: 6379

tracker:
  ttl: 3600
  intervalTask: 600 # 10分钟执行一次定时任务
  mode: memory # memory or db
  memory:
    enablePersist: true
    persistFile: persist.dat
    maxPeersPerTorrent: 1500
    shard: 40
    enableWS: true
  database:
    database: root
    host: localhost
    port: 3306
    user: root
    pass: root
  useUnixSocket: false
  hostPorts: 0.0.0.0:8888
  useAnnounceIP: true
  enableEventProducer: false
  enableMetrics: true

rocketmq:
  topic: TrunkerEvent
  endpoint: 127.0.0.1:8081